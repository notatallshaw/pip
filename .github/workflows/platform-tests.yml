name: Platform tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-versions:
        required: true
        type: string
      groups:
        required: true
        type: string
      dist:
        default: load
        type: string

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYTEST_DISTRIBUTION: ${{ inputs.dist }}

jobs:
  tests:
    name: ${{ matrix.python.version || matrix.python }} / ${{ matrix.group }}
    runs-on: ${{ inputs.os }}
    env:
      NOX_PYTHON: ${{ matrix.python.key || matrix.python }}
      TEST_GROUP: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        group: ${{ fromJSON(inputs.groups) }}

    steps:
      # The D: drive is faster than the system C: drive.
      # https://github.com/actions/runner-images/issues/8755
      - name: Set TEMP to D:/Temp
        if: runner.os == 'Windows'
        run: |
          mkdir "D:\\Temp"
          echo "TEMP=D:\\Temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python.version || matrix.python }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python.version || matrix.python, 't')
        shell: bash
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install brz subversion

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          DEPS=breezy
          if ! which svn; then
            DEPS="${DEPS} subversion"
          fi
          brew install ${DEPS}

      - name: Install Subversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            winget source reset --force
            winget source update winget
            winget install --source winget --accept-source-agreements --accept-package-agreements -e --id Slik.Subversion
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $i)
          }
          echo "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: python -m pip install .
      - run: python -m pip install nox

      - name: Run unit tests
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python -m nox -s "test-$NOX_PYTHON" --
          tests/unit
          --verbose --numprocesses auto --showlocals
      - name: Run integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python -m nox -s "test-$NOX_PYTHON" --no-install --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15
      - name: Set test group count
        if: runner.os != 'Linux'
        shell: bash
        env:
          TEST_GROUPS: ${{ inputs.groups }}
        run: >-
          python -c "import json, os; print('TEST_GROUP_COUNT=' + str(len(json.loads(os.environ['TEST_GROUPS']))))" >> "$GITHUB_ENV"
      - name: Run tests (shard ${{ matrix.group }})
        if: runner.os != 'Linux'
        shell: bash
        run: >-
          python -m nox -s "test-$NOX_PYTHON" --
          tests/unit tests/functional
          --num-test-groups "$TEST_GROUP_COUNT" --test-group "$TEST_GROUP"
          --verbose --numprocesses auto --showlocals --durations=15
          --dist "$PYTEST_DISTRIBUTION"
