name: macOS workers experiment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Keep the experiment PRs to one allocated macOS runner at a time.
concurrency:
  group: pip-macos-ci-experiments
  queue: max

env:
  FORCE_COLOR: "1"

jobs:
  compare:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: workers
            os: macos-26
            groups: 1
            group: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install VCS tools
        run: brew install breezy subversion
      - run: python -m pip install .
      - run: python -m pip install nox==2026.10.20
      - name: Prepare test environment
        run: >-
          python -m nox -s test-3.14 --
          tests/functional --collect-only -q
      - name: Measure functional tests
        env:
          EXPERIMENT_LABEL: ${{ matrix.label }}
          TEST_GROUPS: ${{ matrix.groups }}
          TEST_GROUP: ${{ matrix.group }}
        run: >-
          python .github/scripts/macos_ci_experiment.py --mode workers
          --label "$EXPERIMENT_LABEL"
          --groups "$TEST_GROUPS" --group "$TEST_GROUP"
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-workers-${{ matrix.label }}
          path: macos-ci-results/
          retention-days: 7
          if-no-files-found: warn
