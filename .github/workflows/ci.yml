name: Terminal verification
on:
  workflow_dispatch:
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: python -m pip install nox uv
      - name: Native hooks
        id: hooks
        continue-on-error: true
        run: python -m nox -s lint
      - name: Restore checked-in bytes after hook diagnostics
        run: |
          git diff
          git restore --worktree .
      - name: Native types
        id: types
        continue-on-error: true
        run: python -m nox -s typecheck 2>&1 | tee "$RUNNER_TEMP/candidate-types.txt"
      - name: Prepare unchanged control
        run: git worktree add --detach "$RUNNER_TEMP/pip-control" 64a18397f95ad073c234dbd519f5476b2b9461f5
      - name: Baseline native types with the same dependencies
        id: baseline_types
        continue-on-error: true
        working-directory: ${{ runner.temp }}/pip-control
        run: >-
          "$GITHUB_WORKSPACE/.nox/typecheck/bin/mypy"
          --config-file=tests/typing/pyproject.toml src/pip tests tools noxfile.py
          2>&1 | tee "$RUNNER_TEMP/baseline-types.txt"
      - name: Reject new native type diagnostics
        id: type_comparison
        continue-on-error: true
        run: >-
          python .github/scripts/compare_terminal_types.py
          "$RUNNER_TEMP/baseline-types.txt" "$RUNNER_TEMP/candidate-types.txt"
          "$RUNNER_TEMP/pip-control" "$GITHUB_WORKSPACE"
      - name: Current Ruff formatting
        id: format
        continue-on-error: true
        run: git diff -z --diff-filter=ACMR --name-only 64a18397f95ad073c234dbd519f5476b2b9461f5 HEAD -- '*.py' ':!src/pip/_vendor/*' | xargs -0 uvx --refresh ruff@latest format --check --diff
      - name: Current Ruff lint
        id: lint
        continue-on-error: true
        run: git diff -z --diff-filter=ACMR --name-only 64a18397f95ad073c234dbd519f5476b2b9461f5 HEAD -- '*.py' ':!src/pip/_vendor/*' | xargs -0 uvx ruff@latest check
      - name: Current strict types
        id: strict_types
        continue-on-error: true
        run: >-
          uvx --refresh ty@latest check --extra-search-path src
          --python .nox/typecheck/bin/python --python-version 3.10 --error all
          src/pip/_internal/cli/terminal.py src/pip/_internal/cli/spinners.py
          src/pip/_internal/cli/progress_bars.py src/pip/_internal/utils/logging.py
          src/pip/_internal/utils/compat.py
      - name: Current strict lint review
        id: strict_lint
        continue-on-error: true
        run: uvx ruff@latest check --select ALL --ignore CPY001,COM812,BLE001 src/pip/_internal/cli/terminal.py
      - name: Check results
        if: >-
          steps.hooks.outcome != 'success' || steps.type_comparison.outcome != 'success' ||
          steps.format.outcome != 'success' || steps.lint.outcome != 'success' ||
          steps.strict_types.outcome != 'success' || steps.strict_lint.outcome != 'success'
        run: exit 1
