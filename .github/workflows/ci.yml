name: CI

on:
  push:
    branches: [main]
    tags:
      # Tags for all potential release numbers till 2030.
      - "2[0-9].[0-3]" # 20.0 -> 29.3
      - "2[0-9].[0-3].[0-9]+" # 20.0.0 -> 29.3.[0-9]+
  pull_request:
  schedule:
    - cron: 0 0 * * MON # Run every Monday at 00:00 UTC
  workflow_dispatch:
    # allow manual runs on branches without a PR

env:
  # The "FORCE_COLOR" variable, when set to 1,
  # tells Nox to colorize itself.
  FORCE_COLOR: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s docs

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            vendoring:
              # Anything that's touching "vendored code"
              - "src/pip/_vendor/**"
              - "pyproject.toml"
              - "noxfile.py"
            tests:
              # Anything that's touching code-related stuff
              - ".github/workflows/ci.yml"
              - ".github/workflows/platform-tests.yml"
              - "src/**"
              - "tests/**"
              - "noxfile.py"
              # Holds the pytest configuration and the test dependency groups.
              - "pyproject.toml"
              # The test suite should also run when cutting a release
              # (which is the only time this file is modified).
              - "NEWS.rst"
        if: github.event_name == 'pull_request'

  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Set up git credentials
        run: |
          git config --global user.email "pypa-dev@googlegroups.com"
          git config --global user.name "pip"

      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s prepare-release -- 99.9
      - run: python -m nox -s build-release -- 99.9
      - run: pipx run check-sdist

  vendoring:
    name: vendoring
    runs-on: ubuntu-latest

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.vendoring == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s vendoring
      - run: git diff --exit-code

  tests:
    name: tests / ${{ matrix.os }}
    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
            groups: [1]
          - os: macos-latest
            python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
            groups: [1, 2]
          - os: windows-latest
            python: ["3.10", "3.14", "3.15", "3.14t"]
            groups: [1, 2, 3]
            dist: worksteal
          # Oldest patches catch backport regressions. Use their Ubuntu 24.04 builds.
          # See: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          - os: ubuntu-24.04
            python:
              - {key: "3.10", version: "3.10.4"}
              - {key: "3.11", version: "3.11.0"}
              - {key: "3.12", version: "3.12.0"}
              - {key: "3.13", version: "3.13.0"}
              - {key: "3.14", version: "3.14.0"}
            groups: [1]

    uses: $/.github/workflows/platform-tests.yml
    with:
      os: ${{ matrix.os }}
      python-versions: ${{ toJSON(matrix.python) }}
      groups: ${{ toJSON(matrix.groups) }}
      dist: ${{ matrix.dist || 'load' }}

  tests-zipapp:
    name: tests / zipapp
    runs-on: ubuntu-latest

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install brz subversion

      - run: python -m pip install .
      - run: python -m pip install nox

      # Main check
      - name: Run integration tests
        run: >-
          python -m nox -s test-3.11 --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15
          --use-zipapp

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - determine-changes
      - docs
      - packaging
      - tests
      - tests-zipapp
      - vendoring

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: >-
            ${{
              (
                needs.determine-changes.outputs.vendoring != 'true'
                && github.event_name == 'pull_request'
              )
              && 'vendoring'
              || ''
            }}
            ,
            ${{
              (
                needs.determine-changes.outputs.tests != 'true'
                && github.event_name == 'pull_request'
              )
              && '
                tests,
                tests-zipapp,
              '
              || ''
            }}
          jobs: ${{ toJSON(needs) }}
